aid: mision-admision
name: Mision Admision
description: >-
  Misión Admisión is a Mexican education-technology company based in Mérida that
  prepares high school and university applicants for standardized admission exams
  such as EXANI I, EXANI II, PAA, and the UNAM, IPN, and UAM entrance tests. Its
  consumer web platform (misionadmision.com) delivers self-paced online courses,
  video lessons, interactive study capsules, thousands of practice questions,
  full-length exam simulators, live virtual and in-person classes, and the physical
  Sputnik smartbook guides. Founded in 2001 and online since 2015, the company is a
  seed-stage portfolio company of 500 Global. It is a consumer-facing EdTech
  platform and publishes no public developer API surface at this time; this profile
  is maintained in the API Evangelist network for tracking and enrichment.
